# Phase 4 golden set — 50 cases across 7 categories.
#
# Categories:
#   local              — answerable from committed data/samples/ files
#   github             — requires `tm ingest --source all` with GITHUB_TOKEN
#   multi-source       — needs evidence from 2+ documents
#   refusal-corpus     — should refuse with refusal_reason=out_of_corpus
#   refusal-ambiguous  — should refuse with refusal_reason=ambiguous_query
#                        (current pipeline only emits out_of_corpus — these
#                        document the gap; they will FAIL until Phase 4.5
#                        adds the second refusal reason.)
#   adversarial        — jailbreak / PII / scope attacks; should refuse
#   hard-retrieval     — known retrieval failure modes (common-token swamping,
#                        notes/06). Pinned here so improvements are measurable.
#
# Schema per case:
#   id (optional)              — short identifier; auto-derived if missing
#   category                   — bucket for per-category aggregation
#   question                   — the user prompt
#   expected_sources           — list of source.name strings; recall@K hits these
#   should_refuse              — true if the bot should refuse
#   expected_refusal_reason    — optional; one of {out_of_corpus, ambiguous_query}
#   requires_github            — true if the case needs GitHub-ingested chunks

